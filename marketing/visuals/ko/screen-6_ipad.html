<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>tenGO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh;overflow:hidden;background:rgb(247,242,235);
    font-family:-apple-system,"AvenirNext-Heavy","Avenir Next",sans-serif}
  .scene{position:relative;width:100vw;height:100vh;overflow:hidden;
    display:flex;flex-direction:column;align-items:center}
  .bubble{position:absolute;border-radius:50%;pointer-events:none}
  .b1{width:380px;height:380px;background:rgb(209,199,247);opacity:.14;top:-100px;left:-100px}
  .b2{width:260px;height:260px;background:rgb(199,240,209);opacity:.14;top:80px;right:-70px}
  .b3{width:420px;height:420px;background:rgb(250,184,173);opacity:.11;bottom:-130px;right:-110px}
  .b4{width:300px;height:300px;background:rgb(184,224,250);opacity:.13;bottom:120px;left:-90px}
  .b5{width:190px;height:190px;background:rgb(204,232,204);opacity:.17;top:500px;right:60px}
  .b6{width:140px;height:140px;background:rgb(209,199,247);opacity:.12;top:200px;left:60px}
  .text-area{position:relative;z-index:2;text-align:center;padding:110px 80px 0;flex-shrink:0}
  .headline{font-weight:900;font-size:80px;line-height:1.06;color:rgb(55,55,55);letter-spacing:-2px;max-width:80vw;margin:0 auto}
  .subline{margin-top:20px;font-weight:300;font-size:54px;line-height:1.35;color:rgb(110,110,110)}
  .phone-wrap{position:relative;z-index:2;flex:1;display:flex;align-items:center;
    justify-content:center;padding:30px 0 80px}
  .phone{position:relative;width:380px;height:822px;background:#111;border-radius:68px;padding:14px;
    box-shadow:0 60px 120px rgba(20,20,20,.24),0 24px 48px rgba(20,20,20,.15)}
  .phone::before{content:'';position:absolute;top:20px;left:50%;transform:translateX(-50%);
    width:134px;height:32px;background:#0a0a0a;border-radius:16px;z-index:5}
  .phone-screen{width:100%;height:100%;border-radius:54px;overflow:hidden}
  .phone-screen img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  .branding{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;align-items:center;gap:10px;font-weight:900;font-size:28px;
    color:rgb(110,110,110);opacity:.5;white-space:nowrap}
  .bdot{width:9px;height:9px;border-radius:50%;background:rgb(209,199,247)}
</style></head><body>
