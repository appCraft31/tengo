# Concept 2 — « Tu as 10 secondes pour trouver le meilleur chemin ».
# Même coup que `hidden-move` (la chaîne de 7 à 7,40 s), mais le gel dure les
# dix secondes annoncées et porte un compte à rebours 10 → 1 : la promesse de
# l'accroche est tenue à l'image, sinon l'annonce ment.
# Le gameplay est raccourci d'autant pour tenir dans les 20 s de TikTok.
# L'insert final montre la carte « Daily Challenge » du menu, qui justifie le
# « nouveau chaque jour ».
SOURCE="rush7"
# Même calage d'ouverture que `hidden-move` : le départ colle au gel, sinon la
# première image tombe sur une cascade et montre une grille à moitié vide.
START=7.26
DURATION=5.7
SPEED=1.0
FREEZE_AT=7.36      # gel de 0,10 s à 10,10 s ; en deçà de la première note du tracé
FREEZE_DUR=10.0
COUNTDOWN=10
# Capture régénérable : `../screens_generator/capture_langs.sh` produit
# `render/full_menu_en.png`, à copier ici (le dossier de capture est ignoré
# par git, comme tous les rushes).
INSERT="capture/ios-menu-en.png"
INSERT_DUR=2.0
INSERT_CROP_Y=420   # cale la fenêtre 9:16 sur la carte Daily Challenge
HOOKS=(
  "0.0|1.5|You have 10 seconds."
  "1.7|3.4|Find the best path to 10.|low"
  "11.0|12.7|That was the one.|low"
  "13.1|15.7|New grid every single day.|low"
)
