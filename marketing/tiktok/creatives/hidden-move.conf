# Concept 1 — « 99 % des gens ratent ce coup ».
# La grille se fige juste avant la chaîne de 7 bulles (550 points) que le
# solveur va tracer : le spectateur a trois secondes pour la chercher, puis le
# coup se déroule sous ses yeux. Pas de présentation de l'app en ouverture.
#
# Pendant le gel, tout le texte passe en position basse : le plateau doit rester
# entièrement lisible, c'est l'énigme elle-même. Seule l'accroche d'ouverture,
# avant le gel, s'autorise le haut de l'écran.
# Le départ est collé au gel (0,10 s avant) : toute image antérieure tombait sur
# une cascade, donc une grille à moitié vide — la pire ouverture possible pour la
# seconde qui décide du visionnage. Ici la vidéo s'ouvre sur le plateau complet,
# figé : l'énigme est posée dès la première image.
SOURCE="rush7"
START=7.26
DURATION=6.5
SPEED=1.0
# 7,36 et non 7,44 (première note du tracé) : `sfx_render` ne décale que les
# notes POSTÉRIEURES au gel. Calé sur la note elle-même, le premier « pop »
# tombait sur l'image figée — un son sans geste, immédiatement audible.
FREEZE_AT=7.36      # dernière image avant le tracé de la chaîne de 7
FREEZE_DUR=4.0      # gel de 0,10 s à 4,10 s dans le montage
HOOKS=(
  "0.0|1.6|99% miss this move."
  "1.8|3.0|Find the longest chain.|low"
  "3.1|4.1|Did you see it?|low"
  "4.7|6.5|That's 550 points.|low"
  "8.0|10.5|Try to beat it.|low"
)
