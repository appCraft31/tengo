<!doctype html><html><head><meta charset="utf-8"><style>
/* Carte finale des publicités TikTok — 1080×1920.
   Tout le contenu tient dans la zone sûre : 130 px en haut, 484 px en bas,
   140 px à droite, sinon l'interface de TikTok le recouvre. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F7F2EB}
body{position:relative;font-family:"Avenir Next",ui-rounded,system-ui,sans-serif;color:#3D3D3D}
.deco{position:absolute;border-radius:50%}
.stage{position:absolute;left:0;right:0;top:130px;height:1306px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.icon{width:300px;height:300px;border-radius:68px;box-shadow:0 18px 44px rgba(80,70,55,.22)}
.word{font-size:112px;font-weight:800;letter-spacing:-2px;display:flex;align-items:center;gap:18px}
.dot{width:26px;height:26px;border-radius:50%;background:#FF9E9E;display:inline-block}
.claim{font-size:52px;font-weight:700;color:#4A4A4A}
.stores{display:flex;gap:22px;margin-top:6px}
.store{font-size:34px;font-weight:700;color:#5A5550;background:#fff;
  border:2px solid rgba(71,71,71,.14);border-radius:44px;padding:20px 40px}
</style></head><body>
  <i class="deco" style="width:340px;height:340px;background:#D1F2E0;top:-60px;left:-70px"></i>
  <i class="deco" style="width:220px;height:220px;background:#FFB8DB;opacity:.5;top:210px;right:-50px"></i>
  <i class="deco" style="width:260px;height:260px;background:#FFF59E;opacity:.45;bottom:560px;left:-60px"></i>
  <i class="deco" style="width:190px;height:190px;background:#9EDBFF;opacity:.45;bottom:520px;right:40px"></i>
  <div class="stage">
    <img class="icon" src="ICON_PATH">
    <div class="word">TEN<span class="dot"></span>GO</div>
    <div class="claim">Free on iOS and Android</div>
    <div class="stores"><span class="store">App Store</span><span class="store">Google Play</span></div>
  </div>
</body></html>
