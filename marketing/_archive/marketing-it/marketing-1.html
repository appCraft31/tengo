<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tenGO</title>
<style>
  :root {
    /* Palette pastel — identique à MenuScene.swift */
    --bg:         rgb(247, 242, 235);  /* crème */
    --coral:      rgba(250, 184, 173, 0.18);
    --peach:      rgba(252, 214, 179, 0.18);
    --butter:     rgba(252, 242, 184, 0.18);
    --mint:       rgba(199, 240, 209, 0.18);
    --sky:        rgba(184, 224, 250, 0.18);
    --lavender:   rgba(209, 199, 247, 0.18);
    --pink:       rgba(250, 199, 224, 0.18);
    --sage:       rgba(204, 232, 204, 0.18);
    --periwinkle: rgba(194, 209, 247, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "AvenirNext-Medium", "Avenir Next", sans-serif;
    color: rgb(71, 71, 71);
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  /* Bulles de fond — positions relatives au design 750×1334, ancre centre */
  .bubble {
    position: absolute;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    animation-name: float;
    animation-iteration-count: infinite;
    animation-direction: alternate;
    animation-timing-function: ease-in-out;
  }

  @keyframes float {
    from { transform: translate(-50%, calc(-50% - 18px)); }
    to   { transform: translate(-50%, calc(-50% + 18px)); }
  }

  /* Conversions scène → %  : x_scene/750 et y_scene/1334 (Y inversé) */

  /* (88, -280, 480, corail, 7.2s) */
  .b1 { width: 176px; height: 176px; background: var(--coral);
        margin-left: calc(-280px * 0.54); margin-top: calc(-480px * 0.54);
        animation-duration: 7.2s; }

  /* (62, 260, 350, sky, 9.5s) */
  .b2 { width: 124px; height: 124px; background: var(--sky);
        margin-left: calc(260px * 0.54); margin-top: calc(-350px * 0.54);
        animation-duration: 9.5s; }

  /* (110, -180, -150, pink, 11.0s) */
  .b3 { width: 220px; height: 220px; background: var(--pink);
        margin-left: calc(-180px * 0.54); margin-top: calc(150px * 0.54);
        animation-duration: 11s; }

  /* (74, 310, -320, peach, 8.3s) */
  .b4 { width: 148px; height: 148px; background: var(--peach);
        margin-left: calc(310px * 0.54); margin-top: calc(320px * 0.54);
        animation-duration: 8.3s; }

  /* (96, -60, 560, mint, 10.1s) */
  .b5 { width: 192px; height: 192px; background: var(--mint);
        margin-left: calc(-60px * 0.54); margin-top: calc(-560px * 0.54);
        animation-duration: 10.1s; }

  /* (54, 200, -500, sage, 6.8s) */
  .b6 { width: 108px; height: 108px; background: var(--sage);
        margin-left: calc(200px * 0.54); margin-top: calc(500px * 0.54);
        animation-duration: 6.8s; }

  /* (80, -320, -480, butter, 12.4s) */
  .b7 { width: 160px; height: 160px; background: var(--butter);
        margin-left: calc(-320px * 0.54); margin-top: calc(480px * 0.54);
        animation-duration: 12.4s; }

  /* (68, 80, 200, lavender, 9.0s) */
  .b8 { width: 136px; height: 136px; background: var(--lavender);
        margin-left: calc(80px * 0.54); margin-top: calc(-200px * 0.54);
        animation-duration: 9s; }

  /* (50, -200, -30, periwinkle, 7.6s) */
  .b9 { width: 100px; height: 100px; background: var(--periwinkle);
        margin-left: calc(-200px * 0.54); margin-top: calc(30px * 0.54);
        animation-duration: 7.6s; }

  /* Logo TEN·GO centré */
  .logo {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 18px;
    font-family: -apple-system, "AvenirNext-Heavy", sans-serif;
    font-weight: 900;
    font-size: 84px;
    color: rgb(71, 71, 71);
    letter-spacing: -1px;
  }

  .dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgb(250, 199, 224);  /* rose (non transparent) */
    animation: pulse 2.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  .tagline {
    margin-top: 16px;
    font-family: -apple-system, "AvenirNext-Light", sans-serif;
    font-weight: 300;
    font-size: 22px;
    color: rgb(123, 123, 123);
    letter-spacing: 0.5px;
  }

  /* Responsive : réduit l'échelle sur petits écrans */
  @media (max-width: 640px) {
    .title { font-size: 56px; }
    .dot { width: 20px; height: 20px; }
    .tagline { font-size: 16px; }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="bubble b4"></div>
    <div class="bubble b5"></div>
    <div class="bubble b6"></div>
    <div class="bubble b7"></div>
    <div class="bubble b8"></div>
    <div class="bubble b9"></div>

    <div class="logo">
      <div class="title">
        <span>TEN</span>
        <span class="dot"></span>
        <span>GO</span>
      </div>
      <div class="tagline">Collega. Somma. Libera.</div>
    </div>
  </div>
</body>
</html>
