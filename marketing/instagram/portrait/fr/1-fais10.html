<style>

    gap:26px;margin-top:44px;margin-bottom:54px}

    border-radius:999px;box-shadow:0 16px 36px rgba(60,50,40,.20)}

    font-size:30px;letter-spacing:2px;color:rgb(120,120,120);opacity:.65}
